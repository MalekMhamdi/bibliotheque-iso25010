# ============================================================
# Configuration de pytest (l'outil qui lance les tests)
# ============================================================
[tool.pytest.ini_options]
# Indique à pytest-django où se trouvent les réglages de Django
DJANGO_SETTINGS_MODULE = "config.settings"

# Dossier où pytest cherche les fichiers de test (test_*.py)
testpaths = ["tests"]

# -v = "verbose" : affiche le nom de chaque test et son résultat
addopts = "-v"
markers = [
    "e2e: tests de bout en bout dans un vrai navigateur (Playwright)",
]

filterwarnings = [
    # Ignore un avertissement Django sans importance
    "ignore:No directory at:UserWarning:django.core.handlers.base",
    # ← AJOUT : avertissement venant du plugin pytest-playwright (fixture base_url),
    # pas de notre code ; à retirer quand le plugin sera compatible pytest 10
    "ignore::pytest.PytestRemovedIn10Warning",
]

# ============================================================
# Couverture de code (pytest-cov)
# ============================================================
[tool.coverage.run]
# ← AJOUT de "api" : le dossier de l'API REST n'était pas mesuré
source = ["comptes", "catalogue", "prets", "audit", "api", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py", "manage.py"]

# ============================================================
# Ruff (lint et format)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]